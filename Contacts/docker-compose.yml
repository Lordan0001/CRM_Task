services:

  contacts.api:
    image: ${DOCKER_REGISTRY-}contactsapi
    build:
      context: .
      dockerfile: Contacts.API/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    depends_on:
      - contact-server
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080;https://+:8081

  contact-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_password123!"
      ACCEPT_EULA: "Y"
    ports:
      - "1440:1433"
    volumes:
      - contactssqlvolume:/var/opt/mssql

volumes:
  contactssqlvolume: